<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>q-a</title>
    <style>
        body {
            background-color: #32CD32;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .question-container {
            margin-top: 50px;
        }
        button {
            display: block;
            margin: 10px auto;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        input[type="range"] {
            width: 80%;\n
            margin: 20px 0;
        }
        .slider-value {
            font-size: 18px;\n
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const questions = [
            {

                question: "Wie kommst du morgens zur Schule?",
                type: "Question",
                answers: [
                    { text: "Fahrrad", points: -250},
                    { text: "Auto", points: 500 },
                    { text: "Elektrische Fortbewegung (E-Bike, E-Scooter)", points: 0 },
                    { text: "Öffentliche Verkehrsmittel", points: 250 },
                    { text: "Laufen", points: -250 }
                ]
            },
            {
                question: "Wie oft isst du tierische Produkte pro Woche?",            
                type: "slider2", 
                max: 28,    
                min: 1 
            },  
            {
                question: "Wie oft isst du Fleisch Produkte pro Woche?",            
                type: "slider2", 
                max: 28,    
                min: 1 
            },  
            {
                question: "Isst du Label-Produkte? ",
                type: "Question",
                answers: [
                    { text: "Ja", points:-100 },
                    { text: "Mittel", points: 0 },
                    { text: "Wenig", points: 100 },
                    { text: "Keine Ahnung", points: 0 }
                ]
            },
            {
                question: "Mit wievielen Personen lebst du im Haushalt? Bitte sich selbst mitzählen.",
                type: "slider6",
                max: 8,    
                min: 1 
            },
            {
                question: "In welchem Haustyp wohnst du?",
                type: "Question",
                answers: [
                    { text: "Mehrfamilienhaus", points: 500 },
                    { text: "Einfamilienhaus", points: 250 }
                ]
            },
            {
                question: "Wieviel gibst du jährlich für Kleidung und Schuhe aus",
                type: "slider3",
                max: 5000,    
                min: 1 
            },
            {
            question: "Wie kommst du wenn du Fastfood essen willst zum Fastfoodrestaurant(Z.B. McDonald's oder Burgerking)?",
            type: "Question",
            answers: [
                { text: "Fahrrad", points: -250 },
                { text: "Auto", points: 500 },
                { text: "Elektrische Fortbewegung (E-Bike, E-Scooter)", points: 0 },
                { text: "Öffentliche Verkehrsmittel", points: 250 },
                { text: "Laufen", points: -250 },
                { text: "Ich esse in keinem Fastfoodrestaurant", points: 0 }
                ]
            },
            {
            question: "Wie kommst du zum Training?",
            type: "Question",
            answers: [
                { text: "Fahrrad", points: -250 },
                { text: "Auto", points: 500 },
                { text: "Elektrische Fortbewegung (E-Bike, E-Scooter)", points: 0 },
                { text: "Öffentliche Verkehrsmittel", points: 250 },
                { text: "Laufen", points: -250 },
                { text: "Ich habe keinen Training", points: 0 }
            ]
            },


            
        ];

        let currentQuestionIndex = 0;
        let totalPoints = 0;
        const maxAnswers = questions.length;
        let answersGiven = 0;

        function showQuestion() {
            const app = document.getElementById("app");
            app.innerHTML = "";

            if (currentQuestionIndex < questions.length && answersGiven < maxAnswers) {
                const questionData = questions[currentQuestionIndex];

                const questionContainer = document.createElement("div");
                questionContainer.className = "question-container";

                const questionElement = document.createElement("h2");
                questionElement.innerText = questionData.question;
                questionContainer.appendChild(questionElement);

                if (questionData.type === "slider1") {
                    const slider = document.createElement("input");
                    slider.type = "range";
                    slider.min = questionData.min;
                    slider.max = questionData.max;
                    slider.value = 0; 

                    const sliderValue = document.createElement("div");
                    sliderValue.className = "slider-value";
                    sliderValue.innerText = `0 `;

                    slider.oninput = () => {
                        sliderValue.innerText = `${slider.value} `;
                    };

                    const submitButton = document.createElement("button");
                    submitButton.innerText = "Bestätigen";
                    submitButton.onclick = () => {
                        totalPoints += parseInt(slider.value);
                        answersGiven++;
                        currentQuestionIndex++;
                        showQuestion();
                    };

                    questionContainer.appendChild(sliderValue);
                    questionContainer.appendChild(slider);
                    questionContainer.appendChild(submitButton);
                }


                if (questionData.type === "slider2") {
                    const slider = document.createElement("input");
                    slider.type = "range";
                    slider.min = questionData.min;
                    slider.max = questionData.max;
                    slider.value = 0; 

                    const sliderValue = document.createElement("div");
                    sliderValue.className = "slider-value";
                    sliderValue.innerText = `0 mal`;

                    slider.oninput = () => {
                        sliderValue.innerText = `${slider.value} mal`;
                    };

                    const submitButton = document.createElement("button");
                    submitButton.innerText = "Bestätigen";
                    submitButton.onclick = () => {
                        totalPoints += parseInt(slider.value)*10;
                        answersGiven++;
                        currentQuestionIndex++;
                        showQuestion();
                    };

                    questionContainer.appendChild(sliderValue);
                    questionContainer.appendChild(slider);
                    questionContainer.appendChild(submitButton);
                } 
                if (questionData.type === "slider3") {
                    const slider = document.createElement("input");
                    slider.type = "range";
                    slider.min = questionData.min;
                    slider.max = questionData.max;
                    slider.value = 0; 

                    const sliderValue = document.createElement("div");
                    sliderValue.className = "slider-value";
                    sliderValue.innerText = `0 €`;

                    slider.oninput = () => {
                        sliderValue.innerText = `ca. ${slider.value} €`;
                    };

                    const submitButton = document.createElement("button");
                    submitButton.innerText = "Bestätigen";
                    submitButton.onclick = () => {
                        totalPoints += parseInt(slider.value) - 500;
                        answersGiven++;
                        currentQuestionIndex++;
                        showQuestion();
                    };

                    questionContainer.appendChild(sliderValue);
                    questionContainer.appendChild(slider);
                    questionContainer.appendChild(submitButton);
                }

                if (questionData.type === "slider5") {
                    const slider = document.createElement("input");
                    slider.type = "range";
                    slider.min = questionData.min;
                    slider.max = questionData.max;
                    slider.value = 0; 

                    const sliderValue = document.createElement("div");
                    sliderValue.className = "slider-value";
                    sliderValue.innerText = `0 mal`;

                    slider.oninput = () => {
                        sliderValue.innerText = `${slider.value} mal`;
                    };

                    const submitButton = document.createElement("button");
                    submitButton.innerText = "Bestätigen";
                    submitButton.onclick = () => {
                        answersGiven++;
                        currentQuestionIndex++;
                        showQuestion();
                    };

                    questionContainer.appendChild(sliderValue);
                    questionContainer.appendChild(slider);
                    questionContainer.appendChild(submitButton);
                } 
                if (questionData.type === "slider6") {
                    const slider = document.createElement("input");
                    slider.type = "range";
                    slider.min = questionData.min;
                    slider.max = questionData.max;
                    slider.value = 0; 

                    const sliderValue = document.createElement("div");
                    sliderValue.className = "slider-value";
                    sliderValue.innerText = `0 `;

                    slider.oninput = () => {
                        sliderValue.innerText = `${slider.value} `;
                    };

                    const submitButton = document.createElement("button");
                    submitButton.innerText = "Bestätigen";
                    submitButton.onclick = () => {
                        totalPoints += parseInt(slider.value) *-20;
                        answersGiven++;
                        currentQuestionIndex++;
                        showQuestion();
                    };

                    questionContainer.appendChild(sliderValue);
                    questionContainer.appendChild(slider);
                    questionContainer.appendChild(submitButton);
                }
                if (questionData.type === "Question")  {

                    questionData.answers.forEach(answer => {
                        const answerButton = document.createElement("button");
                        answerButton.innerText = answer.text;
                        answerButton.onclick = () => {
                            totalPoints += answer.points;
                            answersGiven++;
                            currentQuestionIndex++;
                            showQuestion();
                        };
                        questionContainer.appendChild(answerButton);
                    });
                }
                else{}

                app.appendChild(questionContainer);
            } else {
                showResult();
            }
        }

        function showResult() {
            const app = document.getElementById("app");
            if (totalPoints > 750) {
                app.innerHTML = `<h2>Dein Ergebnis: ${totalPoints} Punkte. Du kannst z.B. an Kleidung sparen oder dich zu Fuß oder mit Fahrrad zu bewegen!</h2>`;
            } else {
                app.innerHTML = `<h2>Dein Ergebnis: ${totalPoints} Punkte. Du bist toll!</h2>`;
            }
        }

        showQuestion();
    </script>
</body>
</html>
